  - kind: bugfix
    description:
      Fail provider startup health checks within 30 seconds when an endpoint is unreachable.
      Report DNS, TLS, connection-refused, and timeout errors clearly, and retry provider
      initialization when Health Check is run after a failed startup.
    extensions:
      - core
    source:
