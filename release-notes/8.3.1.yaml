  - kind: bugfix
    description:
      Honor HTTP_PROXY, HTTPS_PROXY, and NO_PROXY in provider-settings.yaml. Provider
      settings take precedence over inherited proxy settings, and an explicit empty value disables
      the provider proxy. Hub authentication keeps its inherited routing.
    extensions:
      - core
    source:
      id: fragment:changes/unreleased/1502-provider-proxy-env.yaml
      key: c63f2c649a06233d2f2d24a7cb976ca3179334461aa0309bb7343cc8088436ca
